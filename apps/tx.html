<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transaction decoder — Bitcoin Schema</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f6f8fa; --border: #d0d7de;
    --fg: #1f2328; --muted: #57606a; --accent: #e8830c; --link: #0969da;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .2rem; } h1 span { color: var(--accent); }
  p.tag { color: var(--muted); margin: 0 0 1.2rem; }
  a { color: var(--link); text-decoration: none; } a:hover { text-decoration: underline; }
  textarea { width: 100%; height: 9rem; background: var(--panel); color: var(--fg);
             border: 1px solid var(--border); border-radius: 8px; padding: .8rem;
             font: 13px var(--mono); resize: vertical; }
  button { background: var(--accent); color: #fff; font-weight: 600; border: none;
           border-radius: 8px; padding: .55rem 1.4rem; margin-top: .6rem; cursor: pointer; font-size: 1rem; }
  button:hover { filter: brightness(1.1); }
  .error { color: #cf222e; font-family: var(--mono); margin-top: .8rem; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
           padding: 1rem 1.2rem; margin-top: 1.2rem; }
  .panel h2 { font-size: 1rem; margin: 0 0 .6rem; color: var(--muted); }
  dl.derived { display: grid; grid-template-columns: max-content 1fr; gap: .25rem 1rem; margin: 0;
               font: 13px var(--mono); }
  dl.derived dt { color: var(--accent); } dl.derived dd { margin: 0; overflow-wrap: anywhere; }
  pre { font: 12.5px var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; color: var(--fg); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Transaction <span>decoder</span></h1>
  <p class="tag">Paste raw transaction hex. Decoding is performed in your browser by the
     <a href="../codec/codec.js">schema-driven codec</a> — no per-type parsing code, no server.
     · <a href="../index.html">schema</a></p>
  <textarea id="hex" spellcheck="false" placeholder="raw transaction hex…"></textarea>
  <br><button id="go">Decode</button>
  <div id="out"></div>
</div>
<script type="module">
  import { Codec } from '../codec/codec.js';
  const core = await (await fetch('../schema/core.jsonld')).json();
  const codec = new Codec(core);
  const $ = (id) => document.getElementById(id);

  // prefill with the first segwit transaction ever mined
  $('hex').value = (await (await fetch('../test/vectors/first-segwit-tx.json')).json()).hex;

  function decode() {
    const out = $('out');
    out.innerHTML = '';
    try {
      const hex = $('hex').value.trim().toLowerCase();
      const tx = codec.decode('Transaction', hex);
      const derived = {
        txid: codec.txid(tx),
        wtxid: codec.wtxid(tx),
        size: codec.txSize(tx) + ' bytes',
        weight: codec.txWeight(tx) + ' WU',
        vsize: codec.txVsize(tx) + ' vB',
      };
      const instance = {
        '@context': 'https://bitcoin-desktop.github.io/schema/context.jsonld',
        '@type': 'btc:Transaction',
        ...tx,
      };
      out.innerHTML = `
        <div class="panel"><h2>derived</h2><dl class="derived">${
          Object.entries(derived).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')
        }</dl></div>
        <div class="panel"><h2>JSON-LD instance</h2><pre>${
          JSON.stringify(instance, null, 2).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        }</pre></div>`;
    } catch (e) {
      out.innerHTML = `<div class="error">✖ ${e.message}</div>`;
    }
  }
  $('go').addEventListener('click', decode);
  decode();
</script>
</body>
</html>
